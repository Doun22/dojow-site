<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demande de visite reçue | Dojow</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/brand/favicon.png">
  <link rel="apple-touch-icon" href="/assets/img/brand/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <a href="#contenu-principal" class="skip-link">Aller au contenu</a>

  <!-- Page de confirmation : volontairement sans navigation ni bouton d'action.
       Écart assumé à la règle « header et footer identiques partout » (voir A-VALIDER.md). -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="header-brand">

    </div>

        <h1 id="merci-titre">C'est noté !</h1>
        <p>Stéphane vous rappelle au numéro indiqué pour fixer votre visite. En attendant, notez l'adresse : 23 rue Claudot, 54000 Nancy.</p>
        <p><a href="https://www.google.com/maps/search/?api=1&amp;query=23+rue+Claudot+54000+Nancy" class="link-secondary" target="_blank" rel="noopener">Itinéraire Google Maps</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© Dojow <span data-year></span></div>
        <div class="footer-bottom-links">
          <a href="/mentions-legales-politique-de-confidentialite">Mentions légales et confidentialité</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>

</html>
